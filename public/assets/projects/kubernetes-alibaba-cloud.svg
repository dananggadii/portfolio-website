<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="IBM Plex Sans, Inter, system-ui, sans-serif">
  <rect width="800" height="500" fill="#FAFAF8"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#E8E6E1" stroke-width="1"/>

  <!-- Title -->
  <text x="40" y="52" font-size="13" font-weight="600" fill="#1A1A1A" letter-spacing="0.04em">KUBERNETES ON ALIBABA CLOUD</text>
  <text x="40" y="72" font-size="11" fill="#8C8C8C">Multifinance Platform — ACK · SLB · RDS PostgreSQL · Redis</text>
  <line x1="40" y1="88" x2="760" y2="88" stroke="#E8E6E1" stroke-width="1"/>

  <!-- ── Internet / client ── -->
  <rect x="40" y="108" width="90" height="34" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="85" y="123" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">Internet</text>
  <text x="85" y="136" font-size="9" fill="#8C8C8C" text-anchor="middle">Users / API</text>
  <!-- arrow -->
  <line x1="130" y1="125" x2="158" y2="125" stroke="#4A6070" stroke-width="1.5"/>
  <polygon points="158,121 170,125 158,129" fill="#4A6070"/>

  <!-- SLB -->
  <rect x="170" y="108" width="130" height="34" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="235" y="123" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">Server Load Balancer</text>
  <text x="235" y="136" font-size="9" fill="#8C8C8C" text-anchor="middle">Layer 7 · SSL</text>
  <!-- arrow down -->
  <line x1="235" y1="142" x2="235" y2="166" stroke="#4A6070" stroke-width="1.5"/>
  <polygon points="230,166 235,178 240,166" fill="#4A6070"/>

  <!-- ── ACK cluster boundary ── -->
  <rect x="40" y="178" width="560" height="216" rx="4" fill="none" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="56" y="196" font-size="10" fill="#8C8C8C">Alibaba Container Service (ACK) — Production Cluster</text>

  <!-- Ingress controller -->
  <rect x="160" y="206" width="150" height="36" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="235" y="221" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Nginx Ingress Controller</text>
  <text x="235" y="234" font-size="8" fill="#8C8C8C" text-anchor="middle">TLS termination · routing</text>

  <!-- Microservices row -->
  <rect x="56" y="262" width="106" height="46" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="109" y="279" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Account Svc</text>
  <text x="109" y="291" font-size="8" fill="#8C8C8C" text-anchor="middle">3 replicas</text>
  <text x="109" y="302" font-size="8" fill="#8C8C8C" text-anchor="middle">HPA</text>

  <rect x="178" y="262" width="106" height="46" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="231" y="279" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Loan Svc</text>
  <text x="231" y="291" font-size="8" fill="#8C8C8C" text-anchor="middle">4 replicas</text>
  <text x="231" y="302" font-size="8" fill="#8C8C8C" text-anchor="middle">HPA</text>

  <rect x="300" y="262" width="106" height="46" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="353" y="279" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Payment Svc</text>
  <text x="353" y="291" font-size="8" fill="#8C8C8C" text-anchor="middle">3 replicas</text>
  <text x="353" y="302" font-size="8" fill="#8C8C8C" text-anchor="middle">PodDisruptionBudget</text>

  <rect x="422" y="262" width="106" height="46" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="475" y="279" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Notify Svc</text>
  <text x="475" y="291" font-size="8" fill="#8C8C8C" text-anchor="middle">2 replicas</text>
  <text x="475" y="302" font-size="8" fill="#8C8C8C" text-anchor="middle">Queue consumer</text>

  <!-- Network policies line -->
  <rect x="56" y="324" width="472" height="24" rx="4" fill="#FAFAF8" stroke="#E8E6E1" stroke-width="1"/>
  <text x="292" y="340" font-size="8" fill="#8C8C8C" text-anchor="middle">Network Policies · Pod Security Standards · Secrets via ACK Secret Manager</text>

  <!-- Arrow from ingress down to services -->
  <line x1="235" y1="242" x2="235" y2="262" stroke="#4A6070" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="235" y1="252" x2="109" y2="262" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="235" y1="252" x2="353" y2="262" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="235" y1="252" x2="475" y2="262" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── Data layer (right panel) ── -->
  <text x="630" y="196" font-size="10" font-weight="600" fill="#8C8C8C" letter-spacing="0.06em" text-anchor="middle">DATA</text>

  <!-- RDS PostgreSQL -->
  <rect x="630" y="206" width="130" height="46" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="695" y="223" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">ApsaraDB RDS</text>
  <text x="695" y="236" font-size="9" fill="#8C8C8C" text-anchor="middle">PostgreSQL 14</text>
  <text x="695" y="247" font-size="8" fill="#8C8C8C" text-anchor="middle">Multi-AZ · PITR</text>

  <!-- Redis -->
  <rect x="630" y="268" width="130" height="46" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="695" y="285" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">ApsaraDB Redis</text>
  <text x="695" y="298" font-size="9" fill="#8C8C8C" text-anchor="middle">Session cache</text>
  <text x="695" y="309" font-size="8" fill="#8C8C8C" text-anchor="middle">Cluster mode</text>

  <!-- OSS -->
  <rect x="630" y="330" width="130" height="46" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="695" y="347" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">Alibaba OSS</text>
  <text x="695" y="360" font-size="9" fill="#8C8C8C" text-anchor="middle">Document storage</text>
  <text x="695" y="371" font-size="8" fill="#8C8C8C" text-anchor="middle">Versioning on</text>

  <!-- Connection lines from cluster to data -->
  <line x1="600" y1="285" x2="630" y2="285" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="600" y1="309" x2="630" y2="309" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── Observability bar (bottom) ── -->
  <line x1="40" y1="410" x2="760" y2="410" stroke="#E8E6E1" stroke-width="1"/>
  <text x="40" y="430" font-size="10" fill="#8C8C8C">Observability</text>
  <rect x="130" y="418" width="110" height="22" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="185" y="433" font-size="9" fill="#1A1A1A" text-anchor="middle">Prometheus</text>
  <rect x="256" y="418" width="110" height="22" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="311" y="433" font-size="9" fill="#1A1A1A" text-anchor="middle">Grafana</text>
  <rect x="382" y="418" width="110" height="22" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="437" y="433" font-size="9" fill="#1A1A1A" text-anchor="middle">Loki (logs)</text>
  <rect x="508" y="418" width="110" height="22" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="563" y="433" font-size="9" fill="#1A1A1A" text-anchor="middle">HPA autoscaling</text>
  <rect x="634" y="418" width="110" height="22" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="689" y="433" font-size="9" fill="#4A6070" text-anchor="middle" font-weight="500">ACK</text>

  <!-- Footer nodes caption -->
  <text x="40" y="462" font-size="9" fill="#8C8C8C">Nodes</text>
  <rect x="90" y="450" width="90" height="20" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="135" y="464" font-size="8" fill="#1A1A1A" text-anchor="middle">3× ecs.c6.xlarge</text>
  <rect x="192" y="450" width="90" height="20" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="237" y="464" font-size="8" fill="#1A1A1A" text-anchor="middle">2 availability zones</text>
  <rect x="294" y="450" width="120" height="20" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="354" y="464" font-size="8" fill="#1A1A1A" text-anchor="middle">Cluster Autoscaler enabled</text>
</svg>
