<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="IBM Plex Sans, Inter, system-ui, sans-serif">
  <rect width="800" height="500" fill="#FAFAF8"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#E8E6E1" stroke-width="1"/>

  <!-- Title -->
  <text x="40" y="52" font-size="13" font-weight="600" fill="#1A1A1A" letter-spacing="0.04em">INFRASTRUCTURE &amp; OBSERVABILITY — SPMB PLATFORM</text>
  <text x="40" y="72" font-size="11" fill="#8C8C8C">Regional Government · Central Java — Alibaba Cloud · Prometheus · Grafana</text>
  <line x1="40" y1="88" x2="760" y2="88" stroke="#E8E6E1" stroke-width="1"/>

  <!-- ── Infrastructure layer (top) ── -->
  <text x="40" y="112" font-size="10" font-weight="600" fill="#8C8C8C" letter-spacing="0.06em">INFRASTRUCTURE</text>
  <!-- ECS boxes -->
  <rect x="40" y="122" width="110" height="40" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="95" y="139" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">ECS Cluster</text>
  <text x="95" y="153" font-size="9" fill="#8C8C8C" text-anchor="middle">App Services</text>

  <rect x="166" y="122" width="110" height="40" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="221" y="139" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">RDS</text>
  <text x="221" y="153" font-size="9" fill="#8C8C8C" text-anchor="middle">MySQL · HA</text>

  <rect x="292" y="122" width="110" height="40" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="347" y="139" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">OSS</text>
  <text x="347" y="153" font-size="9" fill="#8C8C8C" text-anchor="middle">File Storage</text>

  <rect x="418" y="122" width="110" height="40" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="473" y="139" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">SLB</text>
  <text x="473" y="153" font-size="9" fill="#8C8C8C" text-anchor="middle">Load Balancer</text>

  <rect x="544" y="122" width="110" height="40" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="599" y="139" font-size="10" font-weight="500" fill="#1A1A1A" text-anchor="middle">VPC</text>
  <text x="599" y="153" font-size="9" fill="#8C8C8C" text-anchor="middle">Network Isolation</text>

  <!-- ── Metrics collection (arrows down to scrape layer) ── -->
  <line x1="95" y1="162" x2="95" y2="196" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="221" y1="162" x2="221" y2="196" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="347" y1="162" x2="347" y2="196" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="473" y1="162" x2="473" y2="196" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── Exporter layer ── -->
  <text x="40" y="190" font-size="10" font-weight="600" fill="#8C8C8C" letter-spacing="0.06em">EXPORTERS</text>
  <rect x="40" y="200" width="120" height="36" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="100" y="215" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Aliyun Exporter</text>
  <text x="100" y="228" font-size="8" fill="#8C8C8C" text-anchor="middle">Custom · Cloud metrics</text>

  <rect x="176" y="200" width="120" height="36" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="236" y="215" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Node Exporter</text>
  <text x="236" y="228" font-size="8" fill="#8C8C8C" text-anchor="middle">Host OS metrics</text>

  <rect x="312" y="200" width="120" height="36" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="372" y="215" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">App Exporter</text>
  <text x="372" y="228" font-size="8" fill="#8C8C8C" text-anchor="middle">Service metrics</text>

  <rect x="448" y="200" width="120" height="36" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="508" y="215" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">MySQL Exporter</text>
  <text x="508" y="228" font-size="8" fill="#8C8C8C" text-anchor="middle">DB metrics</text>

  <!-- ── Prometheus (scrapes all exporters) ── -->
  <line x1="100" y1="236" x2="300" y2="286" stroke="#4A6070" stroke-width="1"/>
  <line x1="236" y1="236" x2="304" y2="286" stroke="#4A6070" stroke-width="1"/>
  <line x1="372" y1="236" x2="340" y2="286" stroke="#4A6070" stroke-width="1"/>
  <line x1="508" y1="236" x2="356" y2="286" stroke="#4A6070" stroke-width="1"/>

  <rect x="256" y="286" width="150" height="46" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1.5"/>
  <text x="331" y="305" font-size="11" font-weight="600" fill="#4A6070" text-anchor="middle">Prometheus</text>
  <text x="331" y="320" font-size="9" fill="#8C8C8C" text-anchor="middle">TSDB · 30d retention</text>
  <text x="331" y="330" font-size="8" fill="#8C8C8C" text-anchor="middle">15s scrape interval</text>

  <!-- Prometheus → Grafana -->
  <line x1="406" y1="309" x2="490" y2="309" stroke="#4A6070" stroke-width="1.5"/>
  <polygon points="490,305 502,309 490,313" fill="#4A6070"/>

  <!-- ── Grafana ── -->
  <rect x="502" y="286" width="150" height="46" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1.5"/>
  <text x="577" y="305" font-size="11" font-weight="600" fill="#4A6070" text-anchor="middle">Grafana</text>
  <text x="577" y="320" font-size="9" fill="#8C8C8C" text-anchor="middle">Dashboards · Alerts</text>
  <text x="577" y="330" font-size="8" fill="#8C8C8C" text-anchor="middle">Role-based access</text>

  <!-- ── Alerting ── -->
  <line x1="577" y1="332" x2="577" y2="358" stroke="#4A6070" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="502" y="358" width="150" height="36" rx="4" fill="#FAFAF8" stroke="#E8E6E1" stroke-width="1"/>
  <text x="577" y="373" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Alertmanager</text>
  <text x="577" y="386" font-size="8" fill="#8C8C8C" text-anchor="middle">Slack · Email · PagerDuty</text>

  <!-- Award badge -->
  <rect x="40" y="360" width="190" height="50" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="135" y="381" font-size="10" font-weight="600" fill="#4A6070" text-anchor="middle">🏆 Best SPMB Indonesia</text>
  <text x="135" y="396" font-size="9" fill="#8C8C8C" text-anchor="middle">National award for platform excellence</text>

  <!-- Dashboards grid (right) — offset from Grafana with a clear association bus -->
  <text x="723" y="200" font-size="10" font-weight="600" fill="#8C8C8C" letter-spacing="0.06em" text-anchor="middle">DASHBOARDS</text>
  <rect x="668" y="210" width="110" height="28" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="723" y="228" font-size="9" fill="#1A1A1A" text-anchor="middle">Infrastructure</text>
  <rect x="668" y="248" width="110" height="28" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="723" y="266" font-size="9" fill="#1A1A1A" text-anchor="middle">Application</text>
  <rect x="668" y="286" width="110" height="28" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="723" y="304" font-size="9" fill="#1A1A1A" text-anchor="middle">Database</text>
  <rect x="668" y="324" width="110" height="28" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="723" y="342" font-size="9" fill="#1A1A1A" text-anchor="middle">SLO / SLA</text>
  <!-- Grafana → dashboard association: connector stays outside all boxes -->
  <line x1="652" y1="309" x2="660" y2="309" stroke="#4A6070" stroke-width="1"/>
  <line x1="660" y1="224" x2="660" y2="338" stroke="#4A6070" stroke-width="1"/>
  <line x1="660" y1="224" x2="668" y2="224" stroke="#4A6070" stroke-width="1"/>
  <line x1="660" y1="262" x2="668" y2="262" stroke="#4A6070" stroke-width="1"/>
  <line x1="660" y1="300" x2="668" y2="300" stroke="#4A6070" stroke-width="1"/>
  <line x1="660" y1="338" x2="668" y2="338" stroke="#4A6070" stroke-width="1"/>

  <!-- Footer -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#E8E6E1" stroke-width="1"/>
  <text x="40" y="448" font-size="10" fill="#8C8C8C">Stack</text>
  <rect x="90" y="434" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="140" y="449" font-size="9" fill="#1A1A1A" text-anchor="middle">Alibaba Cloud</text>
  <rect x="204" y="434" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="254" y="449" font-size="9" fill="#1A1A1A" text-anchor="middle">Prometheus</text>
  <rect x="318" y="434" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="368" y="449" font-size="9" fill="#1A1A1A" text-anchor="middle">Grafana</text>
  <rect x="432" y="434" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="482" y="449" font-size="9" fill="#1A1A1A" text-anchor="middle">Aliyun Exporter</text>
  <rect x="546" y="434" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="596" y="449" font-size="9" fill="#1A1A1A" text-anchor="middle">Alertmanager</text>
</svg>
