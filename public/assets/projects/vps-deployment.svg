<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="IBM Plex Sans, Inter, system-ui, sans-serif">
  <rect width="800" height="500" fill="#FAFAF8"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#E8E6E1" stroke-width="1"/>

  <!-- Title -->
  <text x="40" y="52" font-size="13" font-weight="600" fill="#1A1A1A" letter-spacing="0.04em">VPS DEPLOYMENT — DOCKER COMPOSE + GITHUB ACTIONS</text>
  <text x="40" y="72" font-size="11" fill="#8C8C8C">Legal Services Platform — End-to-end CI/CD on VPS · Zero-downtime rolling updates</text>
  <line x1="40" y1="88" x2="760" y2="88" stroke="#E8E6E1" stroke-width="1"/>

  <!-- ── CI/CD Pipeline ── -->
  <text x="40" y="112" font-size="10" font-weight="600" fill="#8C8C8C" letter-spacing="0.06em">CI/CD PIPELINE</text>

  <!-- Developer -->
  <rect x="40" y="122" width="90" height="36" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="85" y="137" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Developer</text>
  <text x="85" y="150" font-size="8" fill="#8C8C8C" text-anchor="middle">git push</text>
  <!-- arrow -->
  <line x1="130" y1="140" x2="156" y2="140" stroke="#4A6070" stroke-width="1.5"/>
  <polygon points="156,136 168,140 156,144" fill="#4A6070"/>

  <!-- GitHub repo -->
  <rect x="168" y="122" width="110" height="36" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="223" y="137" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">GitHub Repository</text>
  <text x="223" y="150" font-size="8" fill="#8C8C8C" text-anchor="middle">main branch trigger</text>
  <!-- arrow -->
  <line x1="278" y1="140" x2="304" y2="140" stroke="#4A6070" stroke-width="1.5"/>
  <polygon points="304,136 316,140 304,144" fill="#4A6070"/>

  <!-- GitHub Actions -->
  <rect x="316" y="122" width="130" height="36" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="381" y="137" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">GitHub Actions</text>
  <text x="381" y="150" font-size="8" fill="#8C8C8C" text-anchor="middle">Workflow triggered</text>

  <!-- Workflow steps vertically below -->
  <line x1="381" y1="158" x2="381" y2="184" stroke="#4A6070" stroke-width="1.5"/>
  <polygon points="376,184 381,196 386,184" fill="#4A6070"/>

  <rect x="316" y="196" width="130" height="30" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="381" y="215" font-size="9" fill="#1A1A1A" text-anchor="middle">1. Checkout &amp; lint</text>
  <line x1="381" y1="226" x2="381" y2="240" stroke="#E8E6E1" stroke-width="1"/>

  <rect x="316" y="240" width="130" height="30" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="381" y="259" font-size="9" fill="#1A1A1A" text-anchor="middle">2. Run unit tests</text>
  <line x1="381" y1="270" x2="381" y2="284" stroke="#E8E6E1" stroke-width="1"/>

  <rect x="316" y="284" width="130" height="30" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="381" y="303" font-size="9" fill="#1A1A1A" text-anchor="middle">3. docker build &amp; push</text>
  <line x1="381" y1="314" x2="381" y2="328" stroke="#E8E6E1" stroke-width="1"/>

  <rect x="316" y="328" width="130" height="30" rx="4" fill="#4A6070"/>
  <text x="381" y="347" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="600">4. SSH deploy to VPS</text>

  <!-- ── SSH arrow to VPS ── -->
  <line x1="446" y1="343" x2="530" y2="343" stroke="#4A6070" stroke-width="1.5"/>
  <polygon points="530,339 542,343 530,347" fill="#4A6070"/>
  <text x="484" y="336" font-size="8" fill="#4A6070" text-anchor="middle">SSH</text>

  <!-- ── VPS boundary ── -->
  <rect x="542" y="108" width="218" height="300" rx="4" fill="none" stroke="#E8E6E1" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="558" y="126" font-size="10" fill="#8C8C8C">VPS (Ubuntu 22.04)</text>

  <!-- Docker Compose services -->
  <rect x="558" y="136" width="184" height="30" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="650" y="155" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Docker Compose</text>

  <rect x="558" y="180" width="86" height="38" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="601" y="196" font-size="8" font-weight="500" fill="#1A1A1A" text-anchor="middle">app</text>
  <text x="601" y="209" font-size="7" fill="#8C8C8C" text-anchor="middle">Node.js · 3000</text>

  <rect x="656" y="180" width="86" height="38" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="699" y="196" font-size="8" font-weight="500" fill="#1A1A1A" text-anchor="middle">worker</text>
  <text x="699" y="209" font-size="7" fill="#8C8C8C" text-anchor="middle">Background jobs</text>

  <rect x="558" y="230" width="86" height="38" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="601" y="246" font-size="8" font-weight="500" fill="#1A1A1A" text-anchor="middle">postgres</text>
  <text x="601" y="259" font-size="7" fill="#8C8C8C" text-anchor="middle">Port 5432</text>

  <rect x="656" y="230" width="86" height="38" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="699" y="246" font-size="8" font-weight="500" fill="#1A1A1A" text-anchor="middle">redis</text>
  <text x="699" y="259" font-size="7" fill="#8C8C8C" text-anchor="middle">Session cache</text>

  <!-- Nginx reverse proxy -->
  <rect x="558" y="280" width="184" height="38" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="650" y="296" font-size="9" font-weight="500" fill="#1A1A1A" text-anchor="middle">Nginx (reverse proxy)</text>
  <text x="650" y="309" font-size="8" fill="#8C8C8C" text-anchor="middle">SSL · rate limiting · port 443</text>

  <!-- Health check label -->
  <rect x="558" y="330" width="184" height="30" rx="4" fill="#FAFAF8" stroke="#E8E6E1" stroke-width="1"/>
  <text x="650" y="349" font-size="8" fill="#8C8C8C" text-anchor="middle">Health check · rollback on failure</text>

  <!-- ── Rollback note ── -->
  <rect x="40" y="380" width="480" height="50" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="60" y="398" font-size="10" font-weight="600" fill="#1A1A1A">Deployment strategy</text>
  <text x="60" y="414" font-size="9" fill="#8C8C8C">Rolling update: pull new image → docker-compose up -d → health probe → auto-rollback if unhealthy</text>
  <text x="60" y="426" font-size="8" fill="#8C8C8C">Zero-downtime: old container kept alive until new container passes health check</text>

  <!-- ── Footer ── -->
  <line x1="40" y1="444" x2="760" y2="444" stroke="#E8E6E1" stroke-width="1"/>
  <text x="40" y="464" font-size="10" fill="#8C8C8C">Stack</text>
  <rect x="90" y="452" width="90" height="20" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="135" y="466" font-size="8" fill="#1A1A1A" text-anchor="middle">GitHub Actions</text>
  <rect x="194" y="452" width="90" height="20" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="239" y="466" font-size="8" fill="#1A1A1A" text-anchor="middle">Docker Compose</text>
  <rect x="298" y="452" width="90" height="20" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="343" y="466" font-size="8" fill="#1A1A1A" text-anchor="middle">Nginx</text>
  <rect x="402" y="452" width="90" height="20" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="447" y="466" font-size="8" fill="#1A1A1A" text-anchor="middle">PostgreSQL</text>
  <rect x="506" y="452" width="90" height="20" rx="4" fill="#FFFFFF" stroke="#E8E6E1" stroke-width="1"/>
  <text x="551" y="466" font-size="8" fill="#1A1A1A" text-anchor="middle">Redis</text>
  <rect x="610" y="452" width="90" height="20" rx="4" fill="#FFFFFF" stroke="#4A6070" stroke-width="1"/>
  <text x="655" y="466" font-size="8" fill="#4A6070" text-anchor="middle">SSH Deploy</text>
</svg>
